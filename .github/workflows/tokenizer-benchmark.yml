name: tokenizer-benchmark
on:
  push:
    branches:
      - benchmark/tokenizer-7way-tr-20260905
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install tiktoken==0.12.0 tokenizers==0.22.1 maturin
      - name: Fetch tokenizer assets
        run: |
          git clone --depth 1 https://github.com/whyiug/tokenizer-hub.git tokenizer-hub
          git clone --depth 1 https://github.com/ethosoftai/NedoTokenizer.git nedo
          curl -L --fail --retry 3 -o /tmp/qwen38-tokenizer.json https://huggingface.co/Qwen/Qwen3.8-27B/resolve/main/tokenizer.json
      - name: Install NedoTokenizer
        run: pip install ./nedo
      - name: Run benchmark
        run: python benchmark_tokenizers.py
