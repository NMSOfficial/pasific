name: tokenizer-benchmark
on:
  push:
    branches:
      - benchmark/tokenizer-7way-tr-20260905
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          pip install tiktoken==0.12.0 tokenizers==0.22.1 maturin pyarrow huggingface_hub
      - name: Fetch tokenizer assets
        run: |
          git clone --depth 1 https://github.com/whyiug/tokenizer-hub.git tokenizer-hub
          git clone --depth 1 https://github.com/ethosoftai/NedoTokenizer.git nedo
      - name: Install NedoTokenizer
        run: pip install ./nedo
      - name: Run 1GB benchmark
        run: python benchmark_tokenizers_1gb.py
