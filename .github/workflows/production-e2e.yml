name: Production E2E

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: focused-production-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ORIGIN: http://127.0.0.1:4173
      VERCEL_SHARE_URL: http://127.0.0.1:4173
      SUPABASE_URL: https://pklaxnjngjkonjwgbtxx.supabase.co
      API_URL: https://pasific-production.up.railway.app
      VITE_SUPABASE_URL: https://pklaxnjngjkonjwgbtxx.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_J5SdVbH0rWmJHBOqTahwdg_bkrYRDhT
      VITE_API_URL: https://pasific-production.up.railway.app
      TEACHER_CODE: E2E-TEACH4-260806
      TEACHER_USERNAME: e2e-teacher4-260806
      STUDENT_CODE: E2E-STUDENT4-260806
      STUDENT_USERNAME: e2e-student4-260806
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Generate ephemeral password
        run: echo "TEST_PASSWORD=$(openssl rand -hex 18)Aa1" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Start frontend preview
        run: |
          nohup npm exec vite -- preview --host 127.0.0.1 --port 4173 >/tmp/pasific-preview.log 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pasific-preview.log
          exit 1

      - name: Align E2E with production runtime
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('scripts/production-e2e.mjs')
          s = p.read_text()

          membership_old = "    assert(profile.role === 'teacher' && profile.school_id, 'Teacher must be linked to a school', profile);"
          membership_new = """    assert(profile.role === 'teacher', 'Activated account must be a teacher', profile);
              const schoolLinks = await rest(
                teacher,
                `teacher_schools?teacher_id=eq.${encodeURIComponent(profile.id)}&select=school_id`,
              );
              assert(schoolLinks.ok && schoolLinks.body?.length === 1, 'Teacher must have one school membership', schoolLinks);
              profile.school_id = schoolLinks.body[0].school_id;"""
          if membership_old not in s:
              raise RuntimeError('Expected teacher school assertion was not found')
          s = s.replace(membership_old, membership_new, 1)

          launch_old = "const browser = await chromium.launch({ headless: true, args: ['--disable-web-security'] });"
          launch_new = """const browser = await chromium.launch({
            headless: true,
            executablePath: process.env.PLAYWRIGHT_CHROME_PATH,
            args: ['--disable-web-security'],
          });"""
          if launch_old not in s:
              raise RuntimeError('Expected Chromium launch line was not found')
          p.write_text(s.replace(launch_old, launch_new, 1))
          PY

      - name: Use system Chrome
        run: |
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then
            echo "No system Chrome executable was found" >&2
            exit 1
          fi
          echo "PLAYWRIGHT_CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"

      - name: Validate E2E syntax
        run: node --check scripts/production-e2e.mjs

      - name: Run production E2E
        run: node scripts/production-e2e.mjs

      - name: Upload production E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-production-e2e-report
          path: test-results/production-e2e
          if-no-files-found: warn
          retention-days: 7
